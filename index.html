<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Subtask Generator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .subtask-generator {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .main-content {
            min-height: 400px;
        }

        .search-section h2,
        .form-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-input-group input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .search-input-group button,
        .change-issue-btn,
        .submit-btn,
        .create-another-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-input-group button:hover:not(:disabled),
        .change-issue-btn:hover,
        .submit-btn:hover:not(:disabled),
        .create-another-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .search-input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .issue-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            animation: fadeIn 0.3s ease-out;
        }

        .issue-summary h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .issue-title {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .change-issue-btn {
            padding: 8px 15px;
            background: white;
            color: #667eea;
        }

        .form-section {
            animation: fadeIn 0.3s ease-out;
        }

        .subtask-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f9f7ff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:disabled,
        .form-group textarea:disabled,
        .form-group select:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }

        .form-group .error {
            color: #f44;
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            padding: 14px 30px;
            font-size: 16px;
            margin-top: 10px;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fee;
            border-left: 4px solid #f44;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            animation: slideUp 0.3s ease-out;
        }

        .success-message {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border-left: 4px solid #22c55e;
            color: #015f0e;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            animation: slideUp 0.3s ease-out;
        }

        .success-message p {
            margin-bottom: 10px;
        }

        .success-message strong {
            font-weight: 600;
        }

        .create-another-btn {
            padding: 10px 20px;
            background: white;
            color: #015f0e;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .subtask-generator {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .search-input-group {
                flex-direction: column;
            }

            .search-input-group button {
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Load configuration from localStorage
        // Credentials are set via auto-load-env.html or setup-credentials.html
        const CONFIG = {
            JIRA_SERVER: localStorage.getItem('JIRA_SERVER') || '',
            JIRA_PAT: localStorage.getItem('JIRA_PAT') || '',
            OPENAI_API_KEY: localStorage.getItem('OPENAI_API_KEY') || '',
            OPENAI_BASE_URL: localStorage.getItem('OPENAI_BASE_URL') || 'https://api.openai.com/v1',
            AI_MODEL_NAME: localStorage.getItem('AI_MODEL_NAME') || 'zai-org/GLM-5.3-Flash',
        };

        // Helper: Extract issue key from browse URL or plain key
        const parseIssueKey = (input) => {
            if (!input) return '';
            const trimmed = input.trim();
            const browseMatch = trimmed.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/i);
            if (browseMatch) return browseMatch[1].toUpperCase();
            const keyMatch = trimmed.match(/^([A-Z][A-Z0-9]+-\d+)$/i);
            if (keyMatch) return keyMatch[1].toUpperCase();
            return trimmed;
        };

        // Helper: Add working days to a date (skip weekends)
        const addWorkingDays = (startDate, days) => {
            const result = new Date(startDate);
            let added = 0;
            while (added < days) {
                result.setDate(result.getDate() + 1);
                const dayOfWeek = result.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    added++;
                }
            }
            return result;
        };

        // Helper: Format date to datetime-local input value
        const formatDateTimeLocal = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}T17:00`;
        };

        // Services
        const jiraService = {
            getCurrentUser: async () => {
                try {
                    const response = await axios.get('/api/jira/myself');
                    return response.data;
                } catch (error) {
                    console.warn('Could not fetch Jira user:', error.message);
                    return null;
                }
            },

            createSubtask: async (parentIssueKey, subtaskData) => {
                try {
                    const projectKey = parentIssueKey.split('-')[0];

                     // Map bobot form (High/Medium/Low) ke Boot Task Jira option ids
                     // High=10554[Complex], Medium=10553[Avg], Low=10552[Simple]
                     const bobotToBootTask = { High: '10554', Medium: '10553', Low: '10552' };
                     const bootTaskValue = bobotToBootTask[subtaskData.bobot] || '10553';

                    // Format tanggal ke YYYY-MM-DD untuk Jira date field
                    const formatJiraDate = (datetimeLocal) => {
                        if (!datetimeLocal) return null;
                        return datetimeLocal.substring(0, 10); // ambil YYYY-MM-DD dari datetime-local
                    };

                    const fields = {
                         project: { key: projectKey },
                         parent: { key: parentIssueKey },
                         issuetype: { name: 'Sub-task' },
                         summary: subtaskData.summary,
                         description: (subtaskData.description || "").replace(/\\n/g, "\n"),
                     };

                     // Add System Analyst if available
                    const getUsername = (val) => {
                        if (!val) return null;
                        const v = val.trim();
                        if (window.currentUserData) {
                            if (v.toLowerCase() === (window.currentUserData.displayName || "").toLowerCase() ||
                                v.toLowerCase() === (window.currentUserData.name || "").toLowerCase()) {
                                return window.currentUserData.name || window.currentUserData.key || v;
                            }
                        }
                        return v;
                    };
                     if (subtaskData.systemAnalyst) {
                         fields.customfield_10644 = { name: getUsername(subtaskData.systemAnalyst) };
                     }

                     // Add Programmer END if available
                     if (subtaskData.programmerEnd) {
                         fields.customfield_10665 = formatJiraDate(subtaskData.programmerEnd);
                     }

                     // Add QC End if available
                     if (subtaskData.qcEnd) {
                         fields.customfield_10667 = formatJiraDate(subtaskData.qcEnd);
                     }

                     // Add Bobot Task - send as object with id
                     if (subtaskData.bobot) {
                         fields.customfield_10670 = { id: bootTaskValue };
                     }

                     // Tambahkan labels jika ada
                     if (subtaskData.labels && subtaskData.labels.length > 0) {
                         fields.labels = subtaskData.labels;
                     }

                     // Tambahkan assignee jika ada programmer
                     if (subtaskData.programmer) {
                         const progUser = getUsername(subtaskData.programmer);
                         fields.assignee = { name: progUser };
                         fields.customfield_10663 = { name: progUser };
                     }

                    const response = await axios.post('/api/jira/create-subtask', {
                        payload: { fields },
                    });

                    if (response.data.errors) {
                        throw new Error(Object.values(response.data.errors).join(', '));
                    }
                    if (response.data.errorMessages?.length > 0) {
                        throw new Error(response.data.errorMessages.join(', '));
                    }
                    return response.data;
                } catch (error) {
                    throw new Error(`Failed to create subtask: ${error.response?.data?.errorMessages?.[0] || error.response?.data?.error || error.message}`);
                }
            },
        };

        const aiService = {
            generateDescription: async (userInput, isRegenerate = false) => {
                try {
                    const prompt = `Kamu adalah Senior Technical Lead & Scrum Master untuk tim software development Jira.

TUGAS UTAMA:
Berdasarkan masukan/kendala dari user, analisa dan URAIKAN/BREAKDOWN menjadi deskripsi Jira subtask yang teknis, jelas, dan terstruktur.

PERINTAH SANGAT PENTING (DILARANG VIOLATION):
- DILARANG HANYA MENGULANG ATAU MENYALIN TEKS INPUT USER APA ADANYA!
- Kamu WAJIB menyusun deskripsi teknis dengan 4 section lengkap di bawah ini.

FORMAT OUTPUT JSON (HANYA KELUARKAN JSON VALID TANPA MARKDOWN CODEBLOCK):
{
  "summary": "[FE|BE|Mobile|QA|DevOps|DB] Ringkasan singkat task (maksimal 100 karakter, dalam Bahasa Indonesia)",
  "complexity": "Simple|Medium|Complex|Very Complex",
  "description": "*DESKRIPSI*\\n[Jelaskan secara detail dan teknis apa yang harus dikerjakan oleh programmer]\\n\\n*PERMASALAHAN*\\n[Jelaskan kendala/dampak jika task ini tidak dikerjakan]\\n\\n*LANGKAH PENGERJAAN*\\n1. [Langkah 1 teknis: misal periksa controller/API]\\n2. [Langkah 2 teknis: misal perbaiki query/validasi/logika]\\n3. [Langkah 3 teknis: misal tambahkan error handling & testing]\\n\\n*ACCEPTANCE CRITERIA*\\n- [ ] [Kriteria sukses 1]\\n- [ ] [Kriteria sukses 2]"
}

ATURAN SUMMARY:
- Gunakan prefix kategori TANPA dash: [FE], [BE], [Mobile], [QA], [DevOps], atau [DB].
- Untuk task [DB] (database): kerjakan sesuai query SQL yang diberikan/dituangkan di deskripsi. Ringkasan cukup menyebutkan konteks query, dan deskripsi HARUS memuat query SQL-nya secara lengkap.

ATURAN DESCRIPTION (PERSIS ikuti struktur ini):
- *DESKRIPSI* - Uraian detail tugas teknis (2-3 paragraf)
- *PERMASALAHAN* - Konteks kendala atau masalah utama (2-4 baris)
- *LANGKAH PENGERJAAN* - Langkah konkrit (WAJIB gunakan nomor 1. 2. 3. dst, 1 baris per langkah)
- *ACCEPTANCE CRITERIA* - Checklist verifikasi (WAJIB format - [ ] checkbox)
- Untuk task [DB]: pastikan query SQL yang akan dijalankan TERTULIS LENGKAP di dalam deskripsi (misal di section *LANGKAH PENGERJAAN* atau section khusus *QUERY SQL*), agar database engineer tinggal menjalankan query tersebut.

Deskripsi task dari user:
${userInput}
${isRegenerate ? "\\n(CATATAN REGENERATE: Ini adalah tombol Re-generate. DILARANG mengulang teks sebelumnya. Buatkan uraian teknis, langkah pengerjaan, dan kriteria sukses BARU yang lebih spesifik, komprehensif, dan beda dari sebelumnya.)" : ""}`;
                    const response = await axios.post('/api/ai/generate', {
                            model: CONFIG.AI_MODEL_NAME,
                            messages: [
                                {
                                    role: 'system',
                                    content: 'Kamu adalah assistant yang membantu generate deskripsi task Jira yang jelas dan terstruktur untuk project software development. PENTING: Selalu respond dengan JSON yang valid saja, tanpa markdown code block, tanpa gambar, tanpa penjelasan tambahan. Hanya JSON murni.',
                                },
                                {
                                    role: 'user',
                                    content: prompt,
                                },
                            ],
                            temperature: isRegenerate ? 0.8 : 0.4,
                            max_tokens: 4000,
                        }
                    );

                    // Robust content extraction: some models (e.g. GLM/DeepSeek thinking)
                    // return null content with the answer in reasoning_content or think-tag blocks
                    const msg = response.data?.choices?.[0]?.message || {};
                    console.log('AI raw message:', JSON.stringify(msg).substring(0, 800));
                    let rawContent = msg.content;
                    if ((!rawContent || !String(rawContent).trim()) && msg.reasoning_content) {
                        // Prefer text after closing think tag if present, else use full reasoning
                        const reasoning = String(msg.reasoning_content);
                        const closing = reasoning.lastIndexOf('>');
                        rawContent = closing !== -1 ? reasoning.substring(closing + 1) : reasoning;
                    }
                    rawContent = String(rawContent || '').trim();
                    if (!rawContent) {
                        console.error('AI response had no content:', JSON.stringify(response.data).substring(0, 1000));
                        throw new Error('AI mengembalikan respons kosong (content null). Coba klik Generate lagi.');
                    }
                    const content = rawContent;
                    
                    console.log('AI Response content:', content.substring(0, 500));
                    
                    // Strip markdown code blocks if present (backtick-fenced json) and think-tag blocks
                    let cleaned = content.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/<\/?thinking>/gi, '').replace(/^```(?:json)?\s*\n?/i, '').replace(/\n?```\s*$/i, '').trim();
                    
                    console.log('AI cleaned content:', cleaned.substring(0, 500));
                    
                    // Try multiple parsing strategies
                    const parseStrategies = [
                        // Strategy 1: Direct parse of cleaned content
                        () => JSON.parse(cleaned),
                        // Strategy 2: Extract JSON object between first { and last }
                        () => {
                            const first = cleaned.indexOf('{');
                            const last = cleaned.lastIndexOf('}');
                            if (first === -1 || last === -1 || last <= first) throw new Error('No braces found');
                            return JSON.parse(cleaned.substring(first, last + 1));
                        },
                        // Strategy 3: Try with raw content (before cleaning)
                        () => {
                            const first = content.indexOf('{');
                            const last = content.lastIndexOf('}');
                            if (first === -1 || last === -1) throw new Error('No braces in raw');
                            return JSON.parse(content.substring(first, last + 1));
                        },
                        // Strategy 4: Fix unescaped newlines inside JSON string values
                        () => {
                            let jsonStr = cleaned;
                            const first = jsonStr.indexOf('{');
                            const last = jsonStr.lastIndexOf('}');
                            if (first === -1 || last === -1) throw new Error('No braces for fix');
                            jsonStr = jsonStr.substring(first, last + 1);
                            // Walk through and escape newlines inside string values
                            let fixed = '';
                            let inStr = false;
                            let esc = false;
                            for (let j = 0; j < jsonStr.length; j++) {
                                const ch = jsonStr[j];
                                if (esc) { fixed += ch; esc = false; continue; }
                                if (ch === '\\') { fixed += ch; esc = true; continue; }
                                if (ch === '"') { inStr = !inStr; fixed += ch; continue; }
                                if (inStr && (ch === '\n' || ch === '\r')) {
                                    if (ch === '\r' && jsonStr[j + 1] === '\n') j++;
                                    fixed += '\\n';
                                    continue;
                                }
                                fixed += ch;
                            }
                            return JSON.parse(fixed);
                        },
                        // Strategy 5: Regex Field Extractor (Unbreakable Fallback)
                        () => {
                            const getVal = (key) => {
                                const reg1 = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"(?=\\s*,\\s*"[a-zA-Z]+"|\\s*\\})`, "i");
                                const m1 = content.match(reg1);
                                if (m1 && m1[1]) return m1[1];
                                const reg2 = new RegExp(`"${key}"\\s*:\\s*"([\\s\\S]*?)"(?=\\s*\\n\\s*\\}|\\s*\\})`, "i");
                                const m2 = content.match(reg2);
                                if (m2 && m2[1]) return m2[1];
                                return null;
                            };
                            const summaryVal = getVal("summary");
                            let descVal = getVal("description");
                            const compVal = getVal("complexity");
                            if (summaryVal || descVal) {
                                let cleanDesc = descVal || userInput;
                                cleanDesc = cleanDesc.replace(/\\\\n/g, "\n").replace(/\\n/g, "\n").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
                                let cleanSummary = summaryVal ? summaryVal.replace(/\\"/g, '"').replace(/\\\\n/g, " ").replace(/\\n/g, " ").replace(/\\\\/g, "\\") : userInput.substring(0, 100);
                                return {
                                    summary: cleanSummary,
                                    description: cleanDesc,
                                    complexity: compVal || "Medium"
                                };
                            }
                            throw new Error("Regex extractor found no fields");
                        },
                    ];
                    
                    for (let i = 0; i < parseStrategies.length; i++) {
                        try {
                            const parsed = parseStrategies[i]();
                            if (parsed && (parsed.summary || parsed.description)) {
                                console.log(`JSON parsed successfully with strategy ${i + 1}`);
                                return parsed;
                            }
                        } catch (e) {
                            console.log(`Strategy ${i + 1} failed:`, e.message);
                        }
                    }
                    
                    // All strategies failed - return fallback with flag
                    console.error('All JSON parsing strategies failed. Raw AI content:', content);
                    return {
                        summary: userInput.substring(0, 100),
                        description: userInput,
                        _isFallback: true
                    };
                } catch (error) {
                     console.error('AI Error Details:', error);
                     // Handle image error gracefully
                     if (error.response?.data?.error?.message?.includes('image') || 
                         error.message?.includes('image') ||
                         error.response?.data?.error?.message?.includes('does not support')) {
                         throw new Error('❌ AI tidak bisa memproses image atau file. Silakan gunakan TEXT DESCRIPTION saja, tanpa menyertakan:\n- Link file/dokumen\n- Screenshot\n- Attachment lainnya\n\nPastikan deskripsi Anda hanya berisi teks murni.');
                     }
                     throw new Error(`AI Error: ${error.message}`);
                 }
            },
        };

        // ========== COMPONENTS ==========

        // Step 2: User describes what needs to be done
         function TaskInputForm({ onGenerate, loading, selectedLabels, setSelectedLabels, AVAILABLE_LABELS }) {
             const [userInput, setUserInput] = useState('');
             const [tempLabels, setTempLabels] = useState(selectedLabels);

             const handleSubmit = (e) => {
                 e.preventDefault();
                 if (userInput.trim()) {
                     setSelectedLabels(tempLabels);
                     onGenerate(userInput);
                 }
             };

             return (
                 <form onSubmit={handleSubmit}>
                     <div className="form-group">
                         <label htmlFor="userInput">Deskripsikan task yang perlu dikerjakan *</label>
                         <textarea
                             id="userInput"
                             value={userInput}
                             onChange={(e) => setUserInput(e.target.value)}
                             placeholder="Contoh: Buat halaman login dengan validasi email dan password, integrasi dengan API auth..."
                             rows="5"
                             disabled={loading}
                             style={{ fontSize: '15px' }}
                         />
                     </div>

                     <div className="form-group" style={{ marginBottom: '15px' }}>
                         <label style={{ fontWeight: 600, marginBottom: '10px' }}>Labels (Optional)</label>
                         <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                             {AVAILABLE_LABELS.map(label => (
                                 <label key={label} style={{ display: 'flex', alignItems: 'center', gap: '6px', cursor: 'pointer', fontSize: '13px' }}>
                                     <input
                                         type="checkbox"
                                         checked={tempLabels.includes(label)}
                                         onChange={(e) => {
                                             if (e.target.checked) {
                                                 setTempLabels([...tempLabels, label]);
                                             } else {
                                                 setTempLabels(tempLabels.filter(l => l !== label));
                                             }
                                         }}
                                         disabled={loading}
                                     />
                                     {label}
                                 </label>
                             ))}
                         </div>
                     </div>

                     <button type="submit" className="submit-btn" disabled={!userInput.trim() || loading}>

         // Step 3: Preview & Review AI-generated results
         function ReviewForm({ formData, onChange, onSubmit, onRegenerate, loading, selectedLabels, setSelectedLabels, AVAILABLE_LABELS }) {
             const [isEditing, setIsEditing] = useState(false);
             const [errors, setErrors] = useState({});

            const validateForm = () => {
                const newErrors = {};
                if (!formData.summary?.trim()) newErrors.summary = 'Summary is required';
                if (!formData.description?.trim()) newErrors.description = 'Description is required';
                if (!formData.bobot) newErrors.bobot = 'Bobot is required';
                if (!formData.storyPoint) newErrors.storyPoint = 'Story point is required';
                if (!formData.systemAnalyst?.trim()) newErrors.systemAnalyst = 'System analyst is required';
                if (!formData.programmer?.trim()) newErrors.programmer = 'Programmer is required';
                if (!formData.programmerEnd) newErrors.programmerEnd = 'Programmer end date is required';
                if (!formData.qcEnd) newErrors.qcEnd = 'QC end date is required';
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;

                        {/* Description */}
                        <div style={{

                         {/* Action Buttons */}

                            <button
                                className="submit-btn"
                                onClick={() => setIsEditing(true)}
                                disabled={loading}
                                style={{ flex: '0 0 auto', background: 'linear-gradient(135deg, #78909c 0%, #546e7a 100%)', padding: '14px 20px' }}

                            <button

            // ===== EDIT MODE =====
            return (

                    </div>

                    <div className="form-group">
                        <label htmlFor="summary">Summary *</label>
                        <input type="text" id="summary" name="summary" value={formData.summary || ''} onChange={handleChange} disabled={loading} />

                    </div>

                    <div className="form-group">
                        <label htmlFor="description">Description *</label>
                        <textarea id="description" name="description" value={formData.description || ''} onChange={handleChange} rows="10" disabled={loading} style={{ fontFamily: 'monospace', fontSize: '13px' }} />
                        {errors.description && <span className="error">{errors.description}</span>}
                    </div>

                    <div className="form-row">
                        <div className="form-group">
                            <label htmlFor="bobot">Bobot Task *</label>
                            <select id="bobot" name="bobot" value={formData.bobot || ''} onChange={handleChange} disabled={loading}>
                                <option value="">-- Select --</option>
                                <option value="High">High</option>

                        </div>
                    </div>

                    <div className="form-row">
                        <div className="form-group">
                            <label htmlFor="systemAnalyst">System Analyst *</label>
                            <input type="text" id="systemAnalyst" name="systemAnalyst" value={formData.systemAnalyst || ''} onChange={handleChange} disabled={loading} />

                        </div>
                        <div className="form-group">
                            <label htmlFor="programmer">Programmer *</label>
                            <input type="text" id="programmer" name="programmer" value={formData.programmer || ''} onChange={handleChange} disabled={loading} />

                    <div className="form-row">
                        <div className="form-group">
                            <label htmlFor="programmerEnd">Programmer End Date *</label>
                            <input type="datetime-local" id="programmerEnd" name="programmerEnd" value={formData.programmerEnd || ''} onChange={handleChange} disabled={loading} />

         // ========== MAIN COMPONENT ==========
         function SubtaskGenerator() {
             // Available labels
             const AVAILABLE_LABELS = [
                 'PascaUAT2-SIMAUDI',
                 'PascaUAT-SIMONTA',
                 'Piloting2-SIMPUL',
                 'IKU-Vananda',
                 'Database-SmartPCC',
             ];
             const [parentIssueKey, setParentIssueKey] = useState('');
             const [parentIssueData, setParentIssueData] = useState(null);
             const [inputValue, setInputValue] = useState('');
             const [selectedLabels, setSelectedLabels] = useState([]);
            const [isKeySet, setIsKeySet] = useState(false);
            const [loading, setLoading] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [jiraServer, setJiraServer] = useState('');
            const [currentUser, setCurrentUser] = useState(null);
            const [reviewData, setReviewData] = useState(null);
            const [lastUserInput, setLastUserInput] = useState('');
            const [aiWarning, setAiWarning] = useState(null);

            // Load config & current user on mount
            useEffect(() => {
                axios.get('/api/config').then(res => {
                    setJiraServer(res.data.jiraServer || '');
                }).catch(() => { });

                jiraService.getCurrentUser().then(user => {
                    if (user) {
                        setCurrentUser(user);
                        window.currentUserData = user;
                    }
                });
            }, []);

            const handleSetIssue = () => {
                setError(null);
                const key = parseIssueKey(inputValue);
                if (!key || !/^[A-Z][A-Z0-9]+-\d+$/i.test(key)) {
                    setError('Format tidak valid. Gunakan format: PCC-1439 atau https://jira.beacukai.go.id/browse/PCC-1439');
                    return;
                }
                setParentIssueKey(key);
                setIsKeySet(true);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSetIssue();
                }
            };

            const handleGenerate = async (userInput, isRegenerate = false) => {
                setGenerating(true);
                setError(null);
                setAiWarning(null);
                setLastUserInput(userInput);

                try {
                    const aiResponse = await aiService.generateDescription(userInput, isRegenerate);

                    // Detect if AI fallback was used
                    const descText = aiResponse.description || "";
                    const isJustUserInput = descText.trim() === userInput.trim() || (!descText.includes("*DESKRIPSI*") && !descText.includes("*LANGKAH PENGERJAAN*"));
                    if (aiResponse._isFallback || isJustUserInput) {
                        setAiWarning("âš ï¸ AI belum menghasilkan deskripsi teknis terstruktur. Klik \"Re-generate\" untuk membuat ulang atau edit secara manual.");
                        console.warn("AI description missing structured sections or matches user input verbatim");
                    }

                    const today = new Date();
                    // Hitung dev working days berdasarkan kompleksitas dari AI
                    let devWorkingDays = 14;
                    if (aiResponse.complexity === "Simple") devWorkingDays = 7;
                    else if (aiResponse.complexity === "Medium") devWorkingDays = 14;
                    else if (aiResponse.complexity === "Complex") devWorkingDays = 18;
                    else if (aiResponse.complexity === "Very Complex") devWorkingDays = 22;

                    const devEndDate = addWorkingDays(today, devWorkingDays);
                    // QC selalu 10 working days setelah programmer selesai
                    const qcEndDate = addWorkingDays(devEndDate, 10);

                    let userObj = currentUser;
                    if (!userObj) {
                        try {
                            userObj = await jiraService.getCurrentUser();
                            if (userObj) setCurrentUser(userObj);
                        } catch (e) {
                            console.warn("Could not auto-fetch Jira user:", e);
                        }
                    }
                    const userName = userObj?.name || userObj?.key || userObj?.username || userObj?.displayName || "";

                    // Map complexity ke bobot
                    let bobot = 'Medium';
                    if (aiResponse.complexity === 'Simple') bobot = 'Low';
                    else if (aiResponse.complexity === 'Complex') bobot = 'High';
                    else if (aiResponse.complexity === 'Very Complex') bobot = 'High';

                    // Map complexity ke story point
                    let storyPoint = '10';
                    if (aiResponse.complexity === 'Simple') storyPoint = '5';
                    else if (aiResponse.complexity === 'Complex' || aiResponse.complexity === 'Very Complex') storyPoint = '15';


                    setReviewData({
                        summary: aiResponse.summary || 'Subtask',
                        description: aiResponse.description || userInput,
                        bobot: bobot,
                        storyPoint: storyPoint,
                         systemAnalyst: userName,
                         programmer: userName,
                         programmerEnd: formatDateTimeLocal(devEndDate),
                         qcEnd: formatDateTimeLocal(qcEndDate),
                    });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setGenerating(false);
                }
            };

            const handleCreate = async (formData) => {
                setLoading(true);
                setError(null);
                setSuccess(null);

                try {
                     // Use selectedLabels array directly
                     const result = await jiraService.createSubtask(parentIssueKey, {
                         summary: formData.summary,
                         description: formData.description,
                         bobot: formData.bobot,
                         storyPoint: formData.storyPoint,
                         systemAnalyst: formData.systemAnalyst,
                         programmer: formData.programmer,
                         programmerEnd: formData.programmerEnd,
                         qcEnd: formData.qcEnd,
                         labels: selectedLabels,
                     });

                    setSuccess({
                        message: 'Subtask berhasil dibuat!',
                        issueKey: result.key,
                        jiraUrl: jiraServer ? `${jiraServer}/browse/${result.key}` : null,
                    });
                    setReviewData(null);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

             const resetAll = () => {
                 setIsKeySet(false);
                 setParentIssueKey('');
                 setInputValue('');
                 setSelectedLabels([]);
                 setError(null);
                 setSuccess(null);
                 setReviewData(null);
                 setLastUserInput('');
             };

            const handleCreateAnother = () => {
                setSuccess(null);
                setError(null);
                setReviewData(null);
                setLastUserInput('');
            };

            const handleEditStep2 = () => {
                setSuccess(null);
                setError(null);
                setReviewData(null);
                // Keep lastUserInput untuk bisa edit lagi
            };

            return (
                <div className="subtask-generator">
                    <div className="header">
                        <h1>Jira Subtask Generator</h1>
                        <p>Generate dan buat subtask otomatis dengan AI</p>
                        {currentUser && (
                            <p style={{ fontSize: '12px', color: '#999', marginTop: '8px' }}>
                                👤 Logged in as: <strong>{currentUser.displayName || currentUser.name}</strong>
                            </p>
                        )}
                    </div>

                    <div className="main-content">
                        {!isKeySet ? (
                            <div className="search-section">
                                <h2>Step 1: Set Parent Issue</h2>
                                <p style={{ color: '#666', marginBottom: '15px', fontSize: '14px' }}>
                                    Paste link Jira atau ketik issue key untuk dijadikan parent subtask.
                                </p>
                                <div style={{ marginBottom: '15px' }}>
                                    <div className="search-input-group">
                                        <input
                                            type="text"
                                            placeholder="Paste URL Jira, e.g. https://jira.beacukai.go.id/browse/PCC-1439"
                                            value={inputValue}
                                            onChange={(e) => setInputValue(e.target.value)}
                                            onKeyPress={handleKeyPress}
                                        />
                                        <button onClick={handleSetIssue} disabled={!inputValue}>
                                            Set Issue
                                        </button>
                                    </div>
                                </div>

                                 <div className="form-group" style={{ marginBottom: '15px' }}>
                                     <label style={{ fontWeight: 600, marginBottom: '10px' }}>Labels (Optional)</label>
                                     <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                                         {AVAILABLE_LABELS.map(label => (
                                             <label key={label} style={{ display: 'flex', alignItems: 'center', gap: '6px', cursor: 'pointer', fontSize: '13px' }}>
                                                 <input
                                                     type="checkbox"
                                                     checked={selectedLabels.includes(label)}
                                                     onChange={(e) => {
                                                         if (e.target.checked) {
                                                             setSelectedLabels([...selectedLabels, label]);
                                                         } else {
                                                             setSelectedLabels(selectedLabels.filter(l => l !== label));
                                                         }
                                                     }}
                                                 />
                                                 {label}
                                             </label>
                                         ))}
                                     </div>
                                 </div>

                                {error && <div className="error-message">{error}</div>}
                            </div>
                        ) : (
                            <>
                                 <div className="issue-summary">
                                     <h2>Parent Issue: {parentIssueKey}</h2>
                                     {jiraServer && (
                                         <p className="issue-title">
                                             <a href={`${jiraServer}/browse/${parentIssueKey}`} target="_blank" rel="noopener noreferrer"
                                                 style={{ color: 'white', textDecoration: 'underline' }}>
                                                 Open in Jira ↗
                                             </a>
                                         </p>
                                     )}
                                     {selectedLabels.length > 0 && (
                                         <div style={{ marginBottom: '15px', padding: '10px', backgroundColor: '#f5f5f5', borderRadius: '6px' }}>
                                             <p style={{ fontSize: '13px', fontWeight: 600, color: '#666', marginBottom: '8px' }}>Labels:</p>
                                             <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                                 {selectedLabels.map(label => (
                                                     <span key={label} style={{ 
                                                         backgroundColor: '#667eea', 
                                                         color: 'white', 
                                                         padding: '4px 10px', 
                                                         borderRadius: '4px',
                                                         fontSize: '12px'
                                                     }}>
                                                         {label}
                                                     </span>
                                                 ))}
                                             </div>
                                         </div>
                                     )}
                                     <button className="change-issue-btn" onClick={resetAll}>
                                         Change Issue
                                     </button>
                                 </div>

                                {!reviewData && !success && (
                                    <div className="form-section">
                                        <h2>Step 2: Deskripsikan Task</h2>
                                        <TaskInputForm
                                             onGenerate={handleGenerate}
                                             loading={generating}
                                             selectedLabels={selectedLabels}
                                             setSelectedLabels={setSelectedLabels}
                                             AVAILABLE_LABELS={AVAILABLE_LABELS}
                                         />
                                    </div>
                                )}

                                {reviewData && !success && (
                                    <div className="form-section" style={{ animation: 'fadeIn 0.3s ease-out' }}>
                                        <h2>Step 3: Review & Create</h2>
                                        {aiWarning && (
                                            <div style={{
                                                background: '#fff3cd',
                                                border: '1px solid #ffc107',
                                                borderRadius: '8px',
                                                padding: '12px 16px',
                                                marginBottom: '16px',
                                                fontSize: '14px',
                                                color: '#856404',
                                                lineHeight: '1.5',
                                            }}>
                                                {aiWarning}
                                            </div>
                                        )}
                                        <ReviewForm
                                             formData={reviewData}
                                             onChange={setReviewData}
                                             onSubmit={handleCreate}
                                             onRegenerate={() => handleGenerate(lastUserInput, true)}
                                             loading={loading || generating}
                                             selectedLabels={selectedLabels}
                                             setSelectedLabels={setSelectedLabels}
                                             AVAILABLE_LABELS={AVAILABLE_LABELS}
                                         />
                                    </div>
                                )}

                                {error && <div className="error-message">{error}</div>}

                                {success && (
                                    <div className="success-message">
                                        <p style={{ fontSize: '18px', marginBottom: '10px' }}>🎉 {success.message}</p>
                                        <p>Issue Key: <strong>{success.issueKey}</strong></p>
                                        {success.jiraUrl && (
                                            <p style={{ marginTop: '8px' }}>
                                                <a href={success.jiraUrl} target="_blank" rel="noopener noreferrer"
                                                    style={{ color: '#015f0e', fontWeight: 600 }}>
                                                    View in Jira ↗
                                                </a>
                                            </p>
                                        )}
                                        <div style={{ display: 'flex', gap: '10px', marginTop: '15px', flexWrap: 'wrap' }}>
                                            <button className="create-another-btn" onClick={handleCreateAnother}>
                                                + Buat Subtask Lagi (Parent Sama)
                                            </button>
                                            <button className="create-another-btn" onClick={handleEditStep2}
                                                style={{ color: '#ff9800' }}>
                                                ✏️ Ubah Step 2
                                            </button>
                                            <button className="create-another-btn" onClick={resetAll}
                                                style={{ color: '#667eea' }}>
                                                🔄 Ganti Parent Issue
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <div className="app-container">
                    <SubtaskGenerator />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
