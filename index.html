<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Subtask Generator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #root {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .subtask-generator {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .main-content {
            min-height: 400px;
        }

        .search-section h2,
        .form-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-input-group input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .search-input-group button,
        .change-issue-btn,
        .submit-btn,
        .create-another-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-input-group button:hover:not(:disabled),
        .change-issue-btn:hover,
        .submit-btn:hover:not(:disabled),
        .create-another-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .search-input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .issue-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            animation: fadeIn 0.3s ease-out;
        }

        .issue-summary h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .issue-title {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .change-issue-btn {
            padding: 8px 15px;
            background: white;
            color: #667eea;
        }

        .form-section {
            animation: fadeIn 0.3s ease-out;
        }

        .subtask-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f9f7ff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:disabled,
        .form-group textarea:disabled,
        .form-group select:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }

        .form-group .error {
            color: #f44;
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            padding: 14px 30px;
            font-size: 16px;
            margin-top: 10px;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fee;
            border-left: 4px solid #f44;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            animation: slideUp 0.3s ease-out;
        }

        .success-message {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border-left: 4px solid #22c55e;
            color: #015f0e;
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
            animation: slideUp 0.3s ease-out;
        }

        .success-message p {
            margin-bottom: 10px;
        }

        .success-message strong {
            font-weight: 600;
        }

        .create-another-btn {
            padding: 10px 20px;
            background: white;
            color: #015f0e;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .subtask-generator {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .search-input-group {
                flex-direction: column;
            }

            .search-input-group button {
                width: 100%;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Load configuration from localStorage
        // Credentials are set via auto-load-env.html or setup-credentials.html
        const CONFIG = {
            JIRA_SERVER: localStorage.getItem('JIRA_SERVER') || '',
            JIRA_PAT: localStorage.getItem('JIRA_PAT') || '',
            OPENAI_API_KEY: localStorage.getItem('OPENAI_API_KEY') || '',
            OPENAI_BASE_URL: localStorage.getItem('OPENAI_BASE_URL') || 'https://api.openai.com/v1',
            AI_MODEL_NAME: localStorage.getItem('AI_MODEL_NAME') || 'gpt-4-turbo-preview',
        };

        // Helper: Extract issue key from browse URL or plain key
        const parseIssueKey = (input) => {
            if (!input) return '';
            const trimmed = input.trim();
            const browseMatch = trimmed.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/i);
            if (browseMatch) return browseMatch[1].toUpperCase();
            const keyMatch = trimmed.match(/^([A-Z][A-Z0-9]+-\d+)$/i);
            if (keyMatch) return keyMatch[1].toUpperCase();
            return trimmed;
        };

        // Helper: Add working days to a date (skip weekends)
        const addWorkingDays = (startDate, days) => {
            const result = new Date(startDate);
            let added = 0;
            while (added < days) {
                result.setDate(result.getDate() + 1);
                const dayOfWeek = result.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    added++;
                }
            }
            return result;
        };

        // Helper: Format date to datetime-local input value
        const formatDateTimeLocal = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}T17:00`;
        };

        // Services
        const jiraService = {
            getCurrentUser: async () => {
                try {
                    const response = await axios.get('/api/jira/myself');
                    return response.data;
                } catch (error) {
                    console.warn('Could not fetch Jira user:', error.message);
                    return null;
                }
            },

            createSubtask: async (parentIssueKey, subtaskData) => {
                try {
                    const projectKey = parentIssueKey.split('-')[0];

                    // Map bobot form (High/Medium/Low) ke Boot Task Jira (Complex/Average/Simple)
                    const bobotToBootTask = { High: 'Complex', Medium: 'Average', Low: 'Simple' };
                    const bootTaskValue = bobotToBootTask[subtaskData.bobot] || 'Average';

                    // Format tanggal ke YYYY-MM-DD untuk Jira date field
                    const formatJiraDate = (datetimeLocal) => {
                        if (!datetimeLocal) return null;
                        return datetimeLocal.substring(0, 10); // ambil YYYY-MM-DD dari datetime-local
                    };

                    const fields = {
                        project: { key: projectKey },
                        parent: { key: parentIssueKey },
                        issuetype: { name: 'Sub-task' },
                        summary: subtaskData.summary,
                        description: subtaskData.description,
                        // Custom fields yang required di Jira
                        customfield_10644: { name: subtaskData.systemAnalyst },  // System Analyst
                        customfield_10665: formatJiraDate(subtaskData.programmerEnd),  // Programmer END
                        customfield_10667: formatJiraDate(subtaskData.qcEnd),  // QC End
                        customfield_10670: { value: bootTaskValue },  // Boot Task (Complex/Average/Simple)
                    };

                    // Tambahkan labels jika ada
                    if (subtaskData.labels && subtaskData.labels.length > 0) {
                        fields.labels = subtaskData.labels;
                    }

                    // Tambahkan assignee jika ada programmer
                    if (subtaskData.programmer) {
                        fields.assignee = { name: subtaskData.programmer };
                    }

                    const response = await axios.post('/api/jira/create-subtask', {
                        payload: { fields },
                    });

                    if (response.data.errors) {
                        throw new Error(Object.values(response.data.errors).join(', '));
                    }
                    if (response.data.errorMessages?.length > 0) {
                        throw new Error(response.data.errorMessages.join(', '));
                    }
                    return response.data;
                } catch (error) {
                    throw new Error(`Failed to create subtask: ${error.response?.data?.errorMessages?.[0] || error.response?.data?.error || error.message}`);
                }
            },
        };

        const aiService = {
            generateDescription: async (userInput) => {
                try {
                    const prompt = `Kamu adalah expert dalam decomposition task untuk Jira project management.

Berdasarkan deskripsi task dari user, analyze kompleksitas task dan generate ringkasan, deskripsi, serta estimasi waktu dalam format JSON:

{
  "summary": "[FE|BE|Mobile|QA|DevOps] - Ringkasan singkat dan jelas (maksimal 200 karakter, dalam Bahasa Indonesia)",
  "description": "## Deskripsi\\nPenjelasan apa yang harus dikerjakan\\n\\n## Permasalahan\\nMasalah atau konteks mengapa task ini penting\\n\\n## Langkah Pengerjaan\\n1. Langkah 1\\n2. Langkah 2\\n3. Langkah 3\\n\\n## Acceptance Criteria\\n- [ ] Kriteria 1\\n- [ ] Kriteria 2",
  "complexity": "Simple|Medium|Complex|Very Complex",
  "estimatedDays": 14
}

PENTING TENTANG SUMMARY:
- Gunakan prefix kategori: [FE] untuk Frontend, [BE] untuk Backend, [Mobile] untuk Mobile, [QA], atau [DevOps]
- Contoh: "[FE] - Buat form login dengan validasi email"
- Contoh: "[BE] - Implementasi API endpoint untuk user authentication"

Panduan Kompleksitas dan Estimasi (dalam hari kerja):
- Simple: Validasi form, UI tweak, bug fix kecil → 3-5 hari
- Medium: CRUD, integrasi 1-2 API, testing → 7-10 hari
- Complex: Payment gateway, auth system, dashboard → 10-14 hari
- Very Complex: Performance optimization, security audit → 14-20 hari

Panduan Description (PENTING - ikuti format ini):
- Gunakan bahasa sehari-hari yang simpel, JANGAN terlalu formal
- Tulis langsung to the point, programmer harus langsung paham apa yang dikerjakan
- Struktur:
  ## Deskripsi - Apa yang harus dikerjakan
  ## Permasalahan - Konteks/masalah yang ingin diatasi
  ## Langkah Pengerjaan - Langkah-langkah konkrit (pakai nomor 1, 2, 3...)
  ## Acceptance Criteria - Checklist untuk verifikasi task selesai

Deskripsi task dari user:
${userInput}

PENTING: 
- Return HANYA JSON yang valid
- Tidak boleh ada markdown code block, gambar, atau teks apapun di luar JSON
- Gunakan escape untuk newline di description: \\n untuk enter
- EstimatedDays minimum 7 hari (1.4 minggu), maksimum 20 hari (4 minggu)`;

                    const response = await axios.post(
                        `${CONFIG.OPENAI_BASE_URL}/chat/completions`,
                        {
                            model: CONFIG.AI_MODEL_NAME,
                            messages: [
                                {
                                    role: 'system',
                                    content: 'Kamu adalah assistant yang membantu generate deskripsi task Jira yang jelas dan terstruktur untuk project software development. PENTING: Selalu respond dengan JSON yang valid saja, tanpa markdown code block, tanpa gambar, tanpa penjelasan tambahan. Hanya JSON murni.',
                                },
                                {
                                    role: 'user',
                                    content: prompt,
                                },
                            ],
                            temperature: 0.7,
                            max_tokens: 2000,
                        },
                        {
                            headers: {
                                'Authorization': `Bearer ${CONFIG.OPENAI_API_KEY}`,
                                'Content-Type': 'application/json',
                            },
                        }
                    );

                    const content = response.data.choices[0].message.content.trim();
                    
                    console.log('AI Response content:', content.substring(0, 500));
                    
                    // Try to parse JSON
                    try {
                        // First try raw parse
                        return JSON.parse(content);
                    } catch (e1) {
                        console.log('Raw parse failed, trying to extract JSON...');
                        
                        // Try to extract JSON from content - find first { and last }
                        const firstBrace = content.indexOf('{');
                        const lastBrace = content.lastIndexOf('}');
                        
                        if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
                            const jsonStr = content.substring(firstBrace, lastBrace + 1);
                            try {
                                const parsed = JSON.parse(jsonStr);
                                console.log('Successfully parsed extracted JSON');
                                return parsed;
                            } catch (e2) {
                                console.error('Extracted JSON invalid:', e2);
                                // Return partial response if extraction failed
                                return {
                                    summary: userInput.substring(0, 100),
                                    description: userInput
                                };
                            }
                        }
                        
                        // Fallback response
                        console.warn('No valid JSON found, using fallback');
                        return {
                            summary: userInput.substring(0, 100),
                            description: userInput
                        };
                    }
                } catch (error) {
                    console.error('AI Error Details:', error);
                    // Handle image error gracefully
                    if (error.message && error.message.includes('image')) {
                        throw new Error('⚠️ AI tidak bisa memproses image. Gunakan text description saja tanpa gambar/link.');
                    }
                    throw new Error(`AI Error: ${error.message}`);
                }
            },
        };

        // ========== COMPONENTS ==========

        // Step 2: User describes what needs to be done
        function TaskInputForm({ onGenerate, loading }) {
            const [userInput, setUserInput] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (userInput.trim()) {
                    onGenerate(userInput);
                }
            };

            return (
                <form onSubmit={handleSubmit}>
                    <div className="form-group">
                        <label htmlFor="userInput">Deskripsikan task yang perlu dikerjakan *</label>
                        <textarea
                            id="userInput"
                            value={userInput}
                            onChange={(e) => setUserInput(e.target.value)}
                            placeholder="Contoh: Buat halaman login dengan validasi email dan password, integrasi dengan API auth..."
                            rows="5"
                            disabled={loading}
                            style={{ fontSize: '15px' }}
                        />
                    </div>
                    <button type="submit" className="submit-btn" disabled={!userInput.trim() || loading}>
                        {loading ? (
                            <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                                <span className="spinner" style={{ width: '20px', height: '20px', margin: 0, borderWidth: '3px' }}></span>
                                AI sedang generate...
                            </span>
                        ) : '🤖 Generate dengan AI'}
                    </button>
                </form>
            );
        }

        // Step 3: Preview & Review AI-generated results
        function ReviewForm({ formData, onChange, onSubmit, onRegenerate, loading }) {
            const [isEditing, setIsEditing] = useState(false);
            const [errors, setErrors] = useState({});

            const validateForm = () => {
                const newErrors = {};
                if (!formData.summary?.trim()) newErrors.summary = 'Summary is required';
                if (!formData.description?.trim()) newErrors.description = 'Description is required';
                if (!formData.bobot) newErrors.bobot = 'Bobot is required';
                if (!formData.storyPoint) newErrors.storyPoint = 'Story point is required';
                if (!formData.systemAnalyst?.trim()) newErrors.systemAnalyst = 'System analyst is required';
                if (!formData.programmer?.trim()) newErrors.programmer = 'Programmer is required';
                if (!formData.programmerEnd) newErrors.programmerEnd = 'Programmer end date is required';
                if (!formData.qcEnd) newErrors.qcEnd = 'QC end date is required';
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = () => {
                if (validateForm()) {
                    onSubmit(formData);
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                onChange({ ...formData, [name]: value });
                if (errors[name]) {
                    setErrors(prev => ({ ...prev, [name]: '' }));
                }
            };

            const bobotColor = { High: '#e53935', Medium: '#fb8c00', Low: '#43a047' };
            const formatDate = (dt) => {
                if (!dt) return '-';
                const d = new Date(dt);
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            };

            // ===== PREVIEW MODE =====
            if (!isEditing) {
                return (
                    <div style={{ animation: 'fadeIn 0.3s ease-out' }}>
                        {/* Metrics Cards */}
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(3, 1fr)',
                            gap: '12px',
                            marginBottom: '20px',
                        }}>
                            <div style={{
                                background: 'linear-gradient(135deg, #e3f2fd, #bbdefb)',
                                borderRadius: '10px',
                                padding: '16px',
                                textAlign: 'center',
                            }}>
                                <div style={{ fontSize: '12px', color: '#1565c0', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Story Point</div>
                                <div style={{ fontSize: '32px', fontWeight: 700, color: '#0d47a1', marginTop: '4px' }}>{formData.storyPoint || '-'}</div>
                            </div>
                            <div style={{
                                background: `linear-gradient(135deg, ${formData.bobot === 'High' ? '#ffebee, #ffcdd2' : formData.bobot === 'Medium' ? '#fff3e0, #ffe0b2' : '#e8f5e9, #c8e6c9'})`,
                                borderRadius: '10px',
                                padding: '16px',
                                textAlign: 'center',
                            }}>
                                <div style={{ fontSize: '12px', color: bobotColor[formData.bobot] || '#666', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Bobot</div>
                                <div style={{ fontSize: '24px', fontWeight: 700, color: bobotColor[formData.bobot] || '#333', marginTop: '4px' }}>{formData.bobot || '-'}</div>
                            </div>
                            <div style={{
                                background: 'linear-gradient(135deg, #f3e5f5, #e1bee7)',
                                borderRadius: '10px',
                                padding: '16px',
                                textAlign: 'center',
                            }}>
                                <div style={{ fontSize: '12px', color: '#7b1fa2', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Assignee</div>
                                <div style={{ fontSize: '14px', fontWeight: 600, color: '#4a148c', marginTop: '8px' }}>{formData.programmer || '-'}</div>
                            </div>
                        </div>

                        {/* Summary */}
                        <div style={{
                            background: '#f5f5f5',
                            borderLeft: '4px solid #667eea',
                            borderRadius: '0 8px 8px 0',
                            padding: '16px',
                            marginBottom: '16px',
                        }}>
                            <div style={{ fontSize: '12px', color: '#666', fontWeight: 600, marginBottom: '6px', textTransform: 'uppercase' }}>Summary</div>
                            <div style={{ fontSize: '16px', fontWeight: 600, color: '#333' }}>{formData.summary}</div>
                        </div>

                        {/* Description */}
                        <div style={{
                            background: '#fafafa',
                            border: '1px solid #e0e0e0',
                            borderRadius: '8px',
                            padding: '16px',
                            marginBottom: '16px',
                        }}>
                            <div style={{ fontSize: '12px', color: '#666', fontWeight: 600, marginBottom: '10px', textTransform: 'uppercase' }}>Description</div>
                            <pre style={{
                                whiteSpace: 'pre-wrap',
                                wordBreak: 'break-word',
                                fontFamily: '-apple-system, sans-serif',
                                fontSize: '14px',
                                color: '#333',
                                lineHeight: '1.6',
                                margin: 0,
                            }}>{formData.description}</pre>
                        </div>

                        {/* Dates */}
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: '1fr 1fr',
                            gap: '12px',
                            marginBottom: '20px',
                        }}>
                            <div style={{ background: '#fff8e1', borderRadius: '8px', padding: '12px' }}>
                                <div style={{ fontSize: '12px', color: '#f57f17', fontWeight: 600 }}>📅 Dev End Date</div>
                                <div style={{ fontSize: '14px', fontWeight: 600, color: '#333', marginTop: '4px' }}>{formatDate(formData.programmerEnd)}</div>
                            </div>
                            <div style={{ background: '#e8eaf6', borderRadius: '8px', padding: '12px' }}>
                                <div style={{ fontSize: '12px', color: '#283593', fontWeight: 600 }}>🧪 QC End Date</div>
                                <div style={{ fontSize: '14px', fontWeight: 600, color: '#333', marginTop: '4px' }}>{formatDate(formData.qcEnd)}</div>
                            </div>
                        </div>

                        {/* Action Buttons */}
                        <div style={{ display: 'flex', gap: '10px' }}>
                            <button
                                className="submit-btn"
                                onClick={handleSubmit}
                                disabled={loading}
                                style={{ flex: 1 }}
                            >
                                {loading ? 'Creating Subtask...' : '🚀 Create Subtask di Jira'}
                            </button>
                            <button
                                className="submit-btn"
                                onClick={() => setIsEditing(true)}
                                disabled={loading}
                                style={{ flex: '0 0 auto', background: 'linear-gradient(135deg, #78909c 0%, #546e7a 100%)', padding: '14px 20px' }}
                            >
                                ✏️ Edit
                            </button>
                            <button
                                className="submit-btn"
                                onClick={onRegenerate}
                                disabled={loading}
                                style={{ flex: '0 0 auto', background: 'linear-gradient(135deg, #ff9800 0%, #f57c00 100%)', padding: '14px 20px' }}
                            >
                                🔄 Re-generate
                            </button>
                        </div>
                    </div>
                );
            }

            // ===== EDIT MODE =====
            return (
                <form className="subtask-form" onSubmit={(e) => { e.preventDefault(); handleSubmit(); }}>
                    <div style={{
                        background: 'linear-gradient(135deg, #fff3e0, #ffe0b2)',
                        border: '1px solid #ffcc80',
                        borderRadius: '8px',
                        padding: '12px 16px',
                        marginBottom: '10px',
                        fontSize: '14px',
                        color: '#e65100',
                    }}>
                        ✏️ Mode edit — ubah field yang perlu, lalu klik Save atau Create.
                    </div>

                    <div className="form-group">
                        <label htmlFor="summary">Summary *</label>
                        <input type="text" id="summary" name="summary" value={formData.summary || ''} onChange={handleChange} disabled={loading} />
                        {errors.summary && <span className="error">{errors.summary}</span>}
                    </div>

                    <div className="form-group">
                        <label htmlFor="description">Description *</label>
                        <textarea id="description" name="description" value={formData.description || ''} onChange={handleChange} rows="10" disabled={loading} style={{ fontFamily: 'monospace', fontSize: '13px' }} />
                        {errors.description && <span className="error">{errors.description}</span>}
                    </div>

                    <div className="form-row">
                        <div className="form-group">
                            <label htmlFor="bobot">Bobot Task *</label>
                            <select id="bobot" name="bobot" value={formData.bobot || ''} onChange={handleChange} disabled={loading}>
                                <option value="">-- Select --</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                            {errors.bobot && <span className="error">{errors.bobot}</span>}
                        </div>
                        <div className="form-group">
                            <label htmlFor="storyPoint">Story Point *</label>
                            <input type="number" id="storyPoint" name="storyPoint" value={formData.storyPoint || ''} onChange={handleChange} min="1" disabled={loading} />
                            {errors.storyPoint && <span className="error">{errors.storyPoint}</span>}
                        </div>
                    </div>

                    <div className="form-row">
                        <div className="form-group">
                            <label htmlFor="systemAnalyst">System Analyst *</label>
                            <input type="text" id="systemAnalyst" name="systemAnalyst" value={formData.systemAnalyst || ''} onChange={handleChange} disabled={loading} />
                            {errors.systemAnalyst && <span className="error">{errors.systemAnalyst}</span>}
                        </div>
                        <div className="form-group">
                            <label htmlFor="programmer">Programmer *</label>
                            <input type="text" id="programmer" name="programmer" value={formData.programmer || ''} onChange={handleChange} disabled={loading} />
                            {errors.programmer && <span className="error">{errors.programmer}</span>}
                        </div>
                    </div>

                    <div className="form-row">
                        <div className="form-group">
                            <label htmlFor="programmerEnd">Programmer End Date *</label>
                            <input type="datetime-local" id="programmerEnd" name="programmerEnd" value={formData.programmerEnd || ''} onChange={handleChange} disabled={loading} />
                            {errors.programmerEnd && <span className="error">{errors.programmerEnd}</span>}
                        </div>
                        <div className="form-group">
                            <label htmlFor="qcEnd">QC End Date *</label>
                            <input type="datetime-local" id="qcEnd" name="qcEnd" value={formData.qcEnd || ''} onChange={handleChange} disabled={loading} />
                            {errors.qcEnd && <span className="error">{errors.qcEnd}</span>}
                        </div>
                    </div>

                    <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>
                        <button type="submit" className="submit-btn" disabled={loading} style={{ flex: 1 }}>
                            {loading ? 'Creating Subtask...' : '🚀 Create Subtask di Jira'}
                        </button>
                        <button
                            type="button"
                            className="submit-btn"
                            onClick={() => setIsEditing(false)}
                            disabled={loading}
                            style={{ flex: '0 0 auto', background: 'linear-gradient(135deg, #78909c 0%, #546e7a 100%)', padding: '14px 20px' }}
                        >
                            👁️ Preview
                        </button>
                    </div>
                </form>
            );
        }

        // ========== MAIN COMPONENT ==========
        function SubtaskGenerator() {
            const [parentIssueKey, setParentIssueKey] = useState('');
            const [parentIssueData, setParentIssueData] = useState(null);
            const [inputValue, setInputValue] = useState('');
            const [labelsInput, setLabelsInput] = useState('');
            const [isKeySet, setIsKeySet] = useState(false);
            const [loading, setLoading] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [jiraServer, setJiraServer] = useState('');
            const [currentUser, setCurrentUser] = useState(null);
            const [reviewData, setReviewData] = useState(null);
            const [lastUserInput, setLastUserInput] = useState('');

            // Load config & current user on mount
            useEffect(() => {
                axios.get('/api/config').then(res => {
                    setJiraServer(res.data.jiraServer || '');
                }).catch(() => { });

                jiraService.getCurrentUser().then(user => {
                    if (user) {
                        setCurrentUser(user);
                    }
                });
            }, []);

            const handleSetIssue = () => {
                setError(null);
                const key = parseIssueKey(inputValue);
                if (!key || !/^[A-Z][A-Z0-9]+-\d+$/i.test(key)) {
                    setError('Format tidak valid. Gunakan format: PCC-1439 atau https://jira.beacukai.go.id/browse/PCC-1439');
                    return;
                }
                setParentIssueKey(key);
                setIsKeySet(true);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSetIssue();
                }
            };

            const handleGenerate = async (userInput) => {
                setGenerating(true);
                setError(null);
                setLastUserInput(userInput);

                try {
                    const aiResponse = await aiService.generateDescription(userInput);

                    const today = new Date();
                    // Dev End: 2 minggu dari sekarang (hardcoded)
                    const devEndDate = addWorkingDays(today, 14);
                    // QC selalu 10 working days (2 minggu) setelah programmer selesai
                    const qcEndDate = addWorkingDays(devEndDate, 10);

                    const userName = currentUser?.name || '';

                    // Map complexity ke bobot
                    let bobot = 'Medium';
                    if (aiResponse.complexity === 'Simple') bobot = 'Low';
                    else if (aiResponse.complexity === 'Complex') bobot = 'High';
                    else if (aiResponse.complexity === 'Very Complex') bobot = 'High';

                    // Map complexity ke story point
                    let storyPoint = '5';
                    if (aiResponse.complexity === 'Simple') storyPoint = '2';
                    else if (aiResponse.complexity === 'Complex') storyPoint = '8';
                    else if (aiResponse.complexity === 'Very Complex') storyPoint = '13';

                    setReviewData({
                        summary: aiResponse.summary || 'Subtask',
                        description: aiResponse.description || userInput,
                        bobot: bobot,
                        storyPoint: storyPoint,
                        systemAnalyst: userName,
                        programmer: userName,
                        programmerEnd: formatDateTimeLocal(devEndDate),
                        qcEnd: formatDateTimeLocal(qcEndDate),
                        labels: labelsInput,
                    });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setGenerating(false);
                }
            };

            const handleCreate = async (formData) => {
                setLoading(true);
                setError(null);
                setSuccess(null);

                try {
                    // Parse labels from string
                    const labelList = formData.labels ? formData.labels.split(',').map(l => l.trim()).filter(l => l) : [];

                    const result = await jiraService.createSubtask(parentIssueKey, {
                        summary: formData.summary,
                        description: formData.description,
                        bobot: formData.bobot,
                        storyPoint: formData.storyPoint,
                        systemAnalyst: formData.systemAnalyst,
                        programmer: formData.programmer,
                        programmerEnd: formData.programmerEnd,
                        qcEnd: formData.qcEnd,
                        labels: labelList,
                    });

                    setSuccess({
                        message: 'Subtask berhasil dibuat!',
                        issueKey: result.key,
                        jiraUrl: jiraServer ? `${jiraServer}/browse/${result.key}` : null,
                    });
                    setReviewData(null);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const resetAll = () => {
                setIsKeySet(false);
                setParentIssueKey('');
                setInputValue('');
                setError(null);
                setSuccess(null);
                setReviewData(null);
                setLastUserInput('');
            };

            const handleCreateAnother = () => {
                setSuccess(null);
                setError(null);
                setReviewData(null);
                setLastUserInput('');
            };

            return (
                <div className="subtask-generator">
                    <div className="header">
                        <h1>Jira Subtask Generator</h1>
                        <p>Generate dan buat subtask otomatis dengan AI</p>
                        {currentUser && (
                            <p style={{ fontSize: '12px', color: '#999', marginTop: '8px' }}>
                                👤 Logged in as: <strong>{currentUser.displayName || currentUser.name}</strong>
                            </p>
                        )}
                    </div>

                    <div className="main-content">
                        {!isKeySet ? (
                            <div className="search-section">
                                <h2>Step 1: Set Parent Issue</h2>
                                <p style={{ color: '#666', marginBottom: '15px', fontSize: '14px' }}>
                                    Paste link Jira atau ketik issue key untuk dijadikan parent subtask.
                                </p>
                                <div style={{ marginBottom: '15px' }}>
                                    <div className="search-input-group">
                                        <input
                                            type="text"
                                            placeholder="Paste URL Jira, e.g. https://jira.beacukai.go.id/browse/PCC-1439"
                                            value={inputValue}
                                            onChange={(e) => setInputValue(e.target.value)}
                                            onKeyPress={handleKeyPress}
                                        />
                                        <button onClick={handleSetIssue} disabled={!inputValue}>
                                            Set Issue
                                        </button>
                                    </div>
                                </div>

                                <div className="form-group" style={{ marginBottom: '15px' }}>
                                    <label htmlFor="step1Labels">Labels (Optional)</label>
                                    <input
                                        type="text"
                                        id="step1Labels"
                                        placeholder="e.g. PascaUAT-Simaudi, IKU-Vananda"
                                        value={labelsInput}
                                        onChange={(e) => setLabelsInput(e.target.value)}
                                        style={{ padding: '10px', border: '1px solid #ddd', borderRadius: '6px', fontSize: '14px' }}
                                    />
                                </div>

                                {error && <div className="error-message">{error}</div>}
                            </div>
                        ) : (
                            <>
                                <div className="issue-summary">
                                    <h2>Parent Issue: {parentIssueKey}</h2>
                                    {jiraServer && (
                                        <p className="issue-title">
                                            <a href={`${jiraServer}/browse/${parentIssueKey}`} target="_blank" rel="noopener noreferrer"
                                                style={{ color: 'white', textDecoration: 'underline' }}>
                                                Open in Jira ↗
                                            </a>
                                        </p>
                                    )}
                                    <button className="change-issue-btn" onClick={resetAll}>
                                        Change Issue
                                    </button>
                                </div>

                                {!reviewData && !success && (
                                    <div className="form-section">
                                        <h2>Step 2: Deskripsikan Task</h2>
                                        <TaskInputForm
                                            onGenerate={handleGenerate}
                                            loading={generating}
                                        />
                                    </div>
                                )}

                                {reviewData && !success && (
                                    <div className="form-section" style={{ animation: 'fadeIn 0.3s ease-out' }}>
                                        <h2>Step 3: Review & Create</h2>
                                        <ReviewForm
                                            formData={reviewData}
                                            onChange={setReviewData}
                                            onSubmit={handleCreate}
                                            onRegenerate={() => handleGenerate(lastUserInput)}
                                            loading={loading || generating}
                                        />
                                    </div>
                                )}

                                {error && <div className="error-message">{error}</div>}

                                {success && (
                                    <div className="success-message">
                                        <p style={{ fontSize: '18px', marginBottom: '10px' }}>🎉 {success.message}</p>
                                        <p>Issue Key: <strong>{success.issueKey}</strong></p>
                                        {success.jiraUrl && (
                                            <p style={{ marginTop: '8px' }}>
                                                <a href={success.jiraUrl} target="_blank" rel="noopener noreferrer"
                                                    style={{ color: '#015f0e', fontWeight: 600 }}>
                                                    View in Jira ↗
                                                </a>
                                            </p>
                                        )}
                                        <div style={{ display: 'flex', gap: '10px', marginTop: '15px' }}>
                                            <button className="create-another-btn" onClick={handleCreateAnother}>
                                                + Buat Subtask Lagi (Parent Sama)
                                            </button>
                                            <button className="create-another-btn" onClick={resetAll}
                                                style={{ color: '#667eea' }}>
                                                🔄 Ganti Parent Issue
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <div className="app-container">
                    <SubtaskGenerator />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
