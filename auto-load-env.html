<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Configuration...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 20px; }
        p { color: #666; font-size: 14px; line-height: 1.6; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            display: none;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            display: none;
        }
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Configuring Application</h1>
        <div class="spinner"></div>
        <p>Loading credentials from server...</p>
        <div class="success" id="success">
            ✓ Configuration loaded successfully!<br>
            <a href="/index.html">Go to Application →</a>
        </div>
        <div class="error" id="error"></div>
    </div>

    <script>
        async function loadConfig() {
            try {
                const response = await fetch('/.env');
                if (!response.ok) {
                    throw new Error('.env file not found');
                }

                const text = await response.text();
                const lines = text.split('\n');

                const config = {};
                lines.forEach(line => {
                    const [key, value] = line.split('=');
                    if (key && value) {
                        const cleanKey = key.trim().replace('REACT_APP_', '');
                        config[cleanKey] = value.trim();
                    }
                });

                if (!config.JIRA_SERVER || !config.JIRA_PAT || !config.OPENAI_API_KEY) {
                    throw new Error('Missing required credentials in .env file');
                }

                localStorage.setItem('JIRA_SERVER', config.JIRA_SERVER);
                localStorage.setItem('JIRA_PAT', config.JIRA_PAT);
                localStorage.setItem('OPENAI_API_KEY', config.OPENAI_API_KEY);
                localStorage.setItem('OPENAI_BASE_URL', config.OPENAI_BASE_URL || '');
                localStorage.setItem('AI_MODEL_NAME', config.AI_MODEL_NAME || '');

                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').style.display = 'none';
                document.getElementById('success').style.display = 'block';

                setTimeout(() => { window.location.href = '/index.html'; }, 1500);
            } catch (error) {
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = `
                    ❌ ${error.message}<br><br>
                    <a href="/setup-credentials.html">Go to Manual Setup →</a>
                `;
            }
        }

        window.addEventListener('load', loadConfig);
    </script>
</body>
</html>
